<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>

    <!--Tailwind Css-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
     <div class="container mx-auto px-4 py-10 max-w-6xl">

        <!-- Header Section -->
        <div class="text-center mb-8">
             <h1 class="text-3xl font-bold text-blue-700"> Random User Generator </h1>
                <p class="text-dark-500 mt-2">Generate random user profiles using an API</p>
        </div>

        <!-- User Section -->
        <div class="bg-white p-6 rounded-xl shadow-md max-w-xl mx-auto mb-10">

            <label class="block text-gray-700 font-semibold mb-2"> Number of Users </label>
                <input type="number" id="userCount" value="1" min="1" max="20" class="w-full border border-gray-300 rounded-lg p-3 mb-4 outline-none focus:ring-2 focus:ring-blue-500">

            <button onclick="getUsers()" id="generateBtn" class="w-full bg-blue-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg">
            Generate Users</button>

        </div>

        <!-- User Profiles -->
        <div id="userContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

    </div>

    <!-- JS-->
    <script src="script.js"></script>

</body>
</html>
